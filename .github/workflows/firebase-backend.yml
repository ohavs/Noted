name: Firebase backend (Firestore, Storage rules, Functions)

on:
  push:
    branches: [main, 'ccr-*']
    paths: ['functions/**', 'firestore.rules', 'firestore.indexes.json', 'storage.rules', 'firebase.json', 'scripts/places-guard.sh', '.github/workflows/firebase-backend.yml']
  workflow_dispatch:

concurrency:
  group: firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g --silent firebase-tools@15
      - name: Enable APIs
        run: |
          AT=$(node -e "require('$(npm root -g)/firebase-tools/lib/auth').getAccessToken(process.env.FIREBASE_TOKEN, []).then(t => console.log(t.access_token))")
          echo "::add-mask::$AT"
          for api in firestore.googleapis.com firebaserules.googleapis.com firebasestorage.googleapis.com \
            cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com \
            eventarc.googleapis.com pubsub.googleapis.com cloudscheduler.googleapis.com fcm.googleapis.com; do
            curl -fsS -X POST -H "Authorization: Bearer $AT" -H "Content-Length: 0" \
              "https://serviceusage.googleapis.com/v1/projects/noted-ce451/services/$api:enable" >/dev/null && echo "enabled $api" \
              || echo "::warning::could not enable $api"
          done
          for i in $(seq 1 12); do
            S=$(curl -fsS -H "Authorization: Bearer $AT" "https://serviceusage.googleapis.com/v1/projects/noted-ce451/services/firestore.googleapis.com" | jq -r .state)
            [ "$S" = "ENABLED" ] && break; sleep 10
          done
          echo "firestore API: $S"
      - name: Firestore database
        run: |
          fb() { firebase "$@" --project noted-ce451 --non-interactive; }
          if fb firestore:databases:list --json | jq -e '.result[]? | select((.name // "") | endswith("/databases/(default)"))' >/dev/null; then
            echo "(default) database exists"
          else
            # Tel Aviv; the free quota covers the (default) database in any location.
            for i in 1 2 3 4; do
              fb firestore:databases:create "(default)" --location me-west1 --delete-protection ENABLED && exit 0
              sleep 30
            done
            exit 1
          fi
      - name: Firestore rules
        run: firebase deploy --only firestore --project noted-ce451 --non-interactive
      - name: Storage rules
        run: |
          if ! firebase deploy --only storage --project noted-ce451 --non-interactive; then
            echo "::warning::Storage not set up yet (needs Blaze + 'Get started' in the console) — media sync stays off."
          fi
      - name: Places server key + kill-switch permissions
        run: bash scripts/places-guard.sh prep || echo "::warning::places prep incomplete"
      - name: Functions (sharing fan-out, notifications, Places, kill switch)
        run: |
          npm ci --prefix functions --silent
          # the first deploy can race Eventarc/Cloud Build permissions that are still propagating
          for i in 1 2 3; do
            firebase deploy --only functions --project noted-ce451 --non-interactive --force && exit 0
            echo "retrying in 90s"; sleep 90
          done
          exit 1
      - name: Kill-switch budget + APK key to Maps SDK only
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bash scripts/places-guard.sh after || echo "::warning::places after-deploy incomplete"
      - name: Report
        if: always()
        run: bash scripts/places-guard.sh report
