name: Android APK

on:
  push:
    branches: [main, 'ccr-*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - 'scripts/firebase-android.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noted.jks"
            # Same key for every release, or in-app updates won't install.
            EXPECTED="3A:8A:46:7A:9C:0A:22:76:45:2F:A5:DD:F7:88:7F:D7:1E:4F:A1:85:D6:F3:75:58:A2:98:D2:EA:0D:13:FA:A2"
            ACTUAL=$(keytool -list -v -keystore "$RUNNER_TEMP/noted.jks" -alias noted -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^\s*SHA256: //p')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Keystore SHA-256 mismatch: $ACTUAL"; exit 1
            fi
            SHA1=$(keytool -list -v -keystore "$RUNNER_TEMP/noted.jks" -alias noted -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^\s*SHA1: //p')
            echo "NOTED_SHA1=$SHA1" >> "$GITHUB_ENV"
            echo "NOTED_SHA256=$ACTUAL" >> "$GITHUB_ENV"
            echo "NOTED_KEYSTORE_FILE=$RUNNER_TEMP/noted.jks" >> "$GITHUB_ENV"
            echo "NOTED_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD missing — building debug-signed APK, no release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Firebase config
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "::warning::No FIREBASE_TOKEN — building without Firebase"; exit 0; fi
          scripts/firebase-android.sh || { echo "::warning::Firebase config failed — building without Firebase"; rm -f app/google-services.json; }

      - name: Build
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PversionCode=${{ github.run_number }}

      - name: Collect APK
        id: apk
        run: |
          V="0.2.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "noted-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noted-${{ steps.apk.outputs.version }}
          path: noted-*.apk

      - name: Release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.apk.outputs.version }}"
          git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d' > notes.txt
          gh release create "v$V" "noted-$V.apk" --title "noted $V" --notes-file notes.txt --target "$GITHUB_SHA"
