name: Deploy prototype (Firebase Hosting)

on:
  push:
    branches: [main, "ccr-*"]
    paths: ["prototype/**", "firebase.json", ".firebaserc", ".github/workflows/deploy-prototype.yml"]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check token
        id: tok
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "::warning::Secret FIREBASE_TOKEN is not set yet — skipping deploy"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        if: steps.tok.outputs.ok == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project noted-ce451 --token "$FIREBASE_TOKEN" --non-interactive
      - name: Smoke test
        if: steps.tok.outputs.ok == 'true'
        run: |
          B=https://noted-ce451.web.app
          for i in 1 2 3 4 5 6; do
            a=$(curl -sS -o /dev/null -w '%{http_code}' $B/ ; true)
            l=$(curl -sS $B/.well-known/assetlinks.json | grep -c 'com.ohav.noted' ; true)
            v=$(curl -sS $B/i/TestTokenAbcdefgh | grep -c 'package=com.ohav.noted' ; true)
            echo "home=$a assetlinks=$l invite=$v"
            if [ "$a" = 200 ] && [ "$l" -ge 1 ] && [ "$v" -ge 1 ]; then
              curl -sSI $B/.well-known/assetlinks.json | grep -i '^content-type'
              echo "live ok"; exit 0
            fi
            sleep 5
          done
          curl -sSI $B/.well-known/assetlinks.json | head -5
          curl -sS $B/i/TestTokenAbcdefgh | head -c 400
          echo "::error::site not reachable after deploy"; exit 1
